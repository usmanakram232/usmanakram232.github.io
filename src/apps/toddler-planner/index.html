<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toddler Play Planner · M. Usman Akram</title>
  <meta name="description" content="A private play planner for toddlers: three activity ideas that fit your time, energy and mess limits, with safety notes and a skills tracker." />
  <link rel="canonical" href="https://usmanakram232.github.io/apps/toddler-planner/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --font-display:'Cormorant Garamond',Georgia,serif; --font-body:'DM Sans',system-ui,sans-serif; --font-mono:'DM Mono',Menlo,monospace; --r:10px; }
    [data-theme="dark"]  { --bg:#0b0c10; --card:#12141b; --ink:#dde1e8; --muted:#9aa3b5; --faint:#7a8397; --border:#222633; --accent:#4a84b8; --accent-dim:rgba(74,132,184,.16); --on-accent:#0b0c10; --warn:#d9a441; --warn-dim:rgba(217,164,65,.14); --ok:#5fb589; }
    [data-theme="light"] { --bg:#f2f3f6; --card:#fff; --ink:#141720; --muted:#454d5e; --faint:#5c6479; --border:#d0d4dd; --accent:#286799; --accent-dim:rgba(40,103,153,.1); --on-accent:#fff; --warn:#8a5a00; --warn-dim:rgba(138,90,0,.1); --ok:#1f7a4d; }
    html { scroll-behavior: smooth; }
    body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-weight:300; font-size:1rem; line-height:1.6; transition:background-color .25s,color .25s; }
    .skip-link { position:absolute; top:1rem; left:1rem; z-index:20; padding:.75rem 1rem; background:var(--accent); color:var(--on-accent); text-decoration:none; transform:translateY(-150%); }
    .skip-link:focus { transform:none; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .site-nav { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--border); padding:.75rem clamp(1rem,4vw,2rem); display:flex; align-items:center; gap:.9rem; }
    .site-nav a { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); text-decoration:none; }
    .site-nav a:hover { color:var(--ink); }
    .theme-toggle { margin-left:auto; background:none; border:1px solid var(--faint); border-radius:50%; width:36px; height:36px; cursor:pointer; color:var(--faint); display:flex; align-items:center; justify-content:center; padding:0; }
    .theme-toggle:hover { color:var(--ink); }
    [data-theme="dark"] .icon-moon,[data-theme="light"] .icon-sun { display:none; }
    main { max-width:760px; margin:0 auto; padding:1.5rem clamp(1rem,4vw,1.5rem) 5rem; }
    h1 { font-family:var(--font-display); font-style:italic; font-weight:400; font-size:clamp(1.9rem,5vw,2.6rem); line-height:1.1; letter-spacing:-.02em; }
    h2 { font-family:var(--font-display); font-weight:500; font-size:1.45rem; line-height:1.2; margin-bottom:.4rem; }
    h3 { font-weight:500; font-size:1rem; }
    .sub { color:var(--muted); font-size:.92rem; margin-top:.35rem; }
    .label { font-family:var(--font-mono); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); display:block; margin-bottom:.5rem; }
    .tabs { display:flex; gap:.25rem; border-bottom:1px solid var(--border); margin:1.25rem 0 1.5rem; position:sticky; top:57px; background:var(--bg); z-index:9; }
    .tab { flex:1; background:none; border:0; border-bottom:2px solid transparent; padding:.8rem .25rem; min-height:44px; color:var(--muted); font:inherit; font-weight:400; cursor:pointer; }
    .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); font-weight:500; }
    section.panel[hidden] { display:none; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:1rem 1.1rem; margin-bottom:.9rem; }
    .row { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; }
    .group { margin-bottom:1rem; }
    .chip { min-height:44px; padding:.35rem .9rem; border:1px solid var(--border); background:transparent; color:var(--ink); border-radius:999px; font:inherit; font-size:.88rem; font-weight:400; cursor:pointer; }
    .chip:hover { border-color:var(--faint); }
    .chip[aria-pressed="true"],.chip[aria-checked="true"] { background:var(--accent-dim); border-color:var(--accent); color:var(--ink); font-weight:500; }
    .btn { min-height:44px; padding:.5rem 1.1rem; border-radius:var(--r); border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); font:inherit; font-weight:500; cursor:pointer; }
    .btn.ghost { background:transparent; color:var(--ink); border-color:var(--border); font-weight:400; }
    .btn.ghost:hover { border-color:var(--faint); }
    .btn.sm { min-height:44px; padding:.35rem .85rem; font-size:.88rem; }
    .meta { display:flex; flex-wrap:wrap; gap:.35rem; margin:.5rem 0; }
    .tag { font-family:var(--font-mono); font-size:.68rem; letter-spacing:.04em; padding:.15rem .5rem; border:1px solid var(--border); border-radius:4px; color:var(--muted); }
    .tag.warn { border-color:var(--warn); color:var(--warn); background:var(--warn-dim); }
    .tag.acc { border-color:var(--accent); color:var(--ink); background:var(--accent-dim); }
    .why { font-size:.85rem; color:var(--muted); margin-top:.2rem; }
    details { margin-top:.6rem; } summary { cursor:pointer; min-height:32px; font-weight:400; color:var(--accent); }
    details > div { padding-top:.4rem; font-size:.93rem; } details ol { padding-left:1.2rem; margin:.3rem 0 .6rem; }
    .kv { margin:.35rem 0; } .kv b { font-weight:500; }
    .safety { border:1px solid var(--warn); background:var(--warn-dim); border-radius:8px; padding:.5rem .75rem; margin:.5rem 0; font-size:.88rem; }
    .safety b { color:var(--warn); font-weight:500; }
    .log-actions { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; margin-top:.8rem; padding-top:.8rem; border-top:1px solid var(--border); }
    select,input[type=text],input[type=date] { min-height:44px; background:var(--bg); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:.3rem .6rem; font:inherit; font-size:.9rem; }
    .bar { height:10px; border-radius:5px; background:var(--border); overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); transition:width .3s; }
    .bar.ok > i { background:var(--ok); }
    .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .seg button { min-height:44px; padding:.2rem .7rem; background:transparent; color:var(--muted); border:0; border-right:1px solid var(--border); font:inherit; font-size:.82rem; cursor:pointer; }
    .seg button:last-child { border-right:0; } .seg button[aria-checked="true"] { background:var(--accent-dim); color:var(--ink); font-weight:500; box-shadow:inset 0 -2px 0 var(--accent); }
    .skill { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:space-between; align-items:center; padding:.5rem 0; border-top:1px solid var(--border); }
    .skill:first-of-type { border-top:0; } .skill small { color:var(--faint); font-family:var(--font-mono); font-size:.68rem; display:block; }
    .ico { flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:14px; color:hsl(var(--h) 65% 68%); background:hsl(var(--h) 45% 50% / .16); border:1px solid hsl(var(--h) 45% 55% / .3); }
    [data-theme="light"] .ico { color:hsl(var(--h) 60% 30%); background:hsl(var(--h) 50% 45% / .12); border-color:hsl(var(--h) 50% 40% / .3); }
    .card-head { display:flex; align-items:center; gap:.8rem; } .burn { display:flex; gap:.8rem; align-items:flex-start; margin-top:.6rem; } .burn p { margin:0; }
    .note { font-size:.85rem; color:var(--muted); } .note.warn { color:var(--warn); }
    .toast { position:fixed; left:50%; bottom:1.25rem; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:.6rem 1rem; border-radius:8px; font-size:.9rem; z-index:30; }
    .toast[hidden] { display:none; }
    footer { max-width:760px; margin:0 auto; padding:1rem clamp(1rem,4vw,1.5rem) 3rem; color:var(--faint); font-size:.82rem; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration:.01ms !important; scroll-behavior:auto !important; } }
    @media print { .site-nav,.tabs,.btn,.chip { display:none; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" aria-label="Site">
    <a href="/">Home</a><a href="/apps/">Apps</a><a href="/blog/">Writing</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark theme" type="button">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </nav>
  <main id="main">
    <h1>Toddler play planner</h1>
    <p class="sub" id="subtitle">Loading</p>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="t-today" aria-controls="p-today" data-tab="today">Today</button>
      <button class="tab" role="tab" id="t-growth" aria-controls="p-growth" data-tab="growth">Growth</button>
      <button class="tab" role="tab" id="t-log" aria-controls="p-log" data-tab="log">Log</button>
      <button class="tab" role="tab" id="t-guide" aria-controls="p-guide" data-tab="guide">Guide</button>
      <button class="tab" role="tab" id="t-refs" aria-controls="p-refs" data-tab="refs">References</button>
    </div>
    <section class="panel" id="p-today" role="tabpanel" aria-labelledby="t-today"></section>
    <section class="panel" id="p-growth" role="tabpanel" aria-labelledby="t-growth" hidden></section>
    <section class="panel" id="p-log" role="tabpanel" aria-labelledby="t-log" hidden></section>
    <section class="panel" id="p-guide" role="tabpanel" aria-labelledby="t-guide" hidden></section>
    <section class="panel" id="p-refs" role="tabpanel" aria-labelledby="t-refs" hidden></section>
  </main>
  <footer>Everything you enter stays in this browser. Nothing is sent anywhere. Ideas come from a curated set of published sources (see References); this is not medical advice.</footer>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:1rem">This app needs JavaScript.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
